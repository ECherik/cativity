<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Cats</title>
    <link rel="stylesheet" href="style.css" />
    <style>
    .cat {
      position: fixed;
      width: 64px;
      height: 64px;
      pointer-events: auto;
    }

    .cat-body {
      width: 100%;
      height: 100%;
      background-size: cover;
      background-repeat: no-repeat;
    }

#chat-icon {
  position: fixed;
  bottom: 20px;
  right: 20px;
  font-size: 24px;
  cursor: pointer;
  user-select: none;
  pointer-events: auto;
}

    </style>
  </head>
  <body>
    <div class="cat" id="cat">
      <div class="message" id="message">🐱 Meow!</div>
      <div class="cat-body" id="cat-body"></div>
    </div>
    <div id="chat-icon">💬</div>
    <script src="../dist/renderer/client.js"></script>
  </body>
</html>
