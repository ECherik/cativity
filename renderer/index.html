<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Cats</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #00000000;
      }

      /* Sign-in overlay */
      .sign-in {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.8);
        backdrop-filter: blur(10px);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        pointer-events: auto;
      }

      .sign-in:empty {
        display: none;
      }

      .sign-in-container {
        background: white;
        padding: 40px;
        border-radius: 16px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        text-align: center;
        min-width: 300px;
      }

      .sign-in-container h2 {
        margin: 0 0 24px 0;
        color: #333;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }

      .sign-in-container input {
        width: 100%;
        padding: 12px 16px;
        font-size: 16px;
        border: 2px solid #ddd;
        border-radius: 8px;
        margin-bottom: 16px;
        box-sizing: border-box;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        transition: border-color 0.2s;
      }

      .sign-in-container input:focus {
        outline: none;
        border-color: #4a9eff;
      }

      .sign-in-container button {
        width: 100%;
        padding: 12px 16px;
        font-size: 16px;
        background: #4a9eff;
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 600;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        transition: background 0.2s;
      }

      .sign-in-container button:hover {
        background: #3a8eef;
      }

      .sign-in-container button:active {
        transform: scale(0.98);
      }
      .color-selection {
        margin: 16px 0;
      }

      .color-selection label {
        display: block;
        margin-bottom: 8px;
        font-size: 14px;
        color: #666;
        text-align: left;
      }

      .color-options {
        display: flex;
        gap: 12px;
        justify-content: center;
      }

      .color-option {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        cursor: pointer;
        transition: all 0.2s;
        border: 3px solid transparent;
      }

      .color-option:hover {
        transform: scale(1.1);
      }

      .color-option.selected {
        border-color: #4a9eff;
        box-shadow:
          0 0 0 2px white,
          0 0 0 4px #4a9eff;
      }
      /* Cat styling */
      .cat {
        position: fixed;
        width: 64px;
        height: 64px;
        pointer-events: auto;
        transition: opacity 0.3s;
      }

      .cat[hidden] {
        display: none !important;
        opacity: 0;
      }

      .cat-body {
        width: 100%;
        height: 100%;
        background-size: cover;
        background-repeat: no-repeat;
      }

      #chat-icon {
        position: fixed;
        bottom: 20px;
        right: 20px;
        font-size: 24px;
        cursor: pointer;
        user-select: none;
        pointer-events: auto;
      }
      .cat-username {
        position: absolute;
        top: -24px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0, 0, 0, 0.8);
        color: white;
        padding: 4px 8px;
        border-radius: 4px;
        font-size: 12px;
        white-space: nowrap;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }

      .message {
        position: absolute;
        top: -48px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0, 0, 0, 0.9);
        color: white;
        padding: 8px 12px;
        border-radius: 8px;
        font-size: 14px;
        white-space: nowrap;
        opacity: 0;
        transition: opacity 0.3s;
        pointer-events: none;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }

      /* Message bubble arrow */
      .message::after {
        content: "";
        position: absolute;
        top: 100%;
        left: 50%;
        transform: translateX(-50%);
        border: 6px solid transparent;
        border-top-color: rgba(0, 0, 0, 0.9);
      }
    </style>
  </head>
  <body>
    <!-- Sign-in overlay (shown initially, hidden after sign-in) -->
    <div class="sign-in" id="sign-in"></div>

    <!-- Your cat (hidden until signed in) -->
    <div class="cat" id="cat">
      <div class="cat-username" id="cat-username"></div>
      <div class="message" id="message">🐱 Meow!</div>
      <div class="cat-body" id="cat-body"></div>
    </div>
    <div id="chat-icon">💬</div>
    <script src="../dist/renderer/client.js"></script>
  </body>
</html>
