<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Cats</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        background: rgba(0, 0, 0, 0.3); /* TEMP: so you can see the window */
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #cat {
        height: 20%;
        width: 20%;
        position: absolute;
        left: 100px;
        bottom: 100px;
        width: 120px;
        cursor: pointer;
        user-select: none;
      }
      #cat {
        pointer-events: auto;
      }
      
      #message {
        position: absolute;
        color: rgb(203, 68, 68);
        font-size: 24px;
        opacity: 0;
        transition: opacity 0.2s;
        left: 100px;
        bottom: 220px; 
        width: 120px;
        text-align: center;
      }

    </style>
  </head>
  <body>
    <img id="cat" src="./test.png" />
    <div id="message">🐱 Meow!</div>

    <script src="index.ts"></script>
  </body>
</html>
