<html>
  <head>
    <meta charset="UTF-8" />
    <title>Cats</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- Auth overlay -->
    <div class="sign-in" id="sign-in"></div>

    <script src="../dist/renderer/client.js"></script>
  </body>
</html>
